<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAREA · Carta Mediterránea</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
--bg:#f8f5ef;
--card:#ffffff;
--text:#141414;
--muted:#6f6f6f;
--line:#e8e1d7;
--accent:#d46f3d;
--radius:24px;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter',sans-serif;
background:var(--bg);
color:var(--text);
overflow-x:hidden;
}

.hero{
height:100vh;
background-size:cover;
background-position:center;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:40px;
}

.hero-content{
max-width:800px;
color:white;
}

.hero small{
letter-spacing:.4em;
text-transform:uppercase;
opacity:.9;
}

.hero h1{
font-size:clamp(4rem,10vw,8rem);
font-weight:800;
margin:20px 0;
}

.hero p{
font-size:1.2rem;
max-width:600px;
margin:auto;
line-height:1.8;
opacity:.9;
}

nav{
position:sticky;
top:0;
background:rgba(248,245,239,.95);
backdrop-filter:blur(12px);
border-bottom:1px solid var(--line);
z-index:100;
}

.nav-inner{
display:flex;
justify-content:flex-start;
gap:40px;
padding:22px;
overflow-x:auto;
overflow-y:hidden;
white-space:nowrap;
scrollbar-width:none;
}

.nav-inner::-webkit-scrollbar{
display:none;
}

.nav-inner a{
flex-shrink:0;
text-decoration:none;
color:var(--text);
font-size:.9rem;
font-weight:600;
letter-spacing:.15em;
text-transform:uppercase;
}

.container{
max-width:1300px;
margin:auto;
padding:80px 30px;
}

.section{
margin-bottom:120px;
}

.section-title{
display:flex;
align-items:center;
gap:30px;
margin-bottom:60px;
}

.section-title h2{
font-size:3rem;
font-weight:800;
white-space:nowrap;
}

.section-title::after{
content:'';
height:1px;
background:var(--line);
flex:1;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
gap:35px;
}

.card{
background:var(--card);
border-radius:var(--radius);
overflow:hidden;
border:1px solid var(--line);
transition:.35s;
}

.card:hover{
transform:translateY(-8px);
box-shadow:0 20px 50px rgba(0,0,0,.08);
}

.card img{
width:100%;
height:250px;
object-fit:cover;
display:block;
}

.content{
padding:25px;
}

.top{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:20px;
margin-bottom:12px;
}

.name{
font-size:1.4rem;
font-weight:700;
}

.price{
font-size:1.2rem;
font-weight:800;
color:var(--accent);
}

.desc{
color:var(--muted);
line-height:1.7;
margin-bottom:15px;
}

.tags{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.tag{
padding:8px 12px;
background:#f4efe8;
border-radius:100px;
font-size:.75rem;
font-weight:600;
}

.footer{
padding:80px 20px;
text-align:center;
border-top:1px solid var(--line);
}

.footer h3{
font-size:2rem;
margin-bottom:10px;
}

.footer p{
color:var(--muted);
line-height:1.8;
}

@media(max-width:768px){

.hero h1{
font-size:4rem;
}

.section-title h2{
font-size:2rem;
}

.grid{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<header class="hero" id="hero"></header>

<nav>
<div class="nav-inner" id="nav"></div>
</nav>

<main class="container" id="main"></main>

<footer class="footer" id="footer"></footer>

<script>
fetch('menu.json')
  .then(res => res.json())
  .then(data => renderMenu(data))
  .catch(err => console.error('Error cargando menu.json:', err));

function renderMenu(data) {
  const r = data.restaurante;

  // Hero
  const hero = document.getElementById('hero');
  hero.style.background = `linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.45)), url('${r.hero_imagen}')`;
  hero.style.backgroundSize = 'cover';
  hero.style.backgroundPosition = 'center';
  hero.innerHTML = `
    <div class="hero-content">
      <small>${r.subtitulo}</small>
      <h1>${r.nombre}</h1>
      <p>${r.descripcion}</p>
    </div>
  `;

  // Título de la pestaña del navegador
  document.title = `${r.nombre} · Carta`;

  // Nav
  const nav = document.getElementById('nav');
  nav.innerHTML = data.secciones
    .map(s => `<a href="#${s.id}">${s.titulo}</a>`)
    .join('');

  // Secciones
  const main = document.getElementById('main');
  main.innerHTML = data.secciones.map(s => `
    <section id="${s.id}" class="section">
      <div class="section-title">
        <h2>${s.titulo}</h2>
      </div>
      <div class="grid">
        ${s.platos.map(p => `
          <div class="card">
            <img src="${p.imagen}" alt="${p.nombre}">
            <div class="content">
              <div class="top">
                <div class="name">${p.nombre}</div>
                <div class="price">${p.precio}</div>
              </div>
              <div class="desc">${p.descripcion}</div>
              ${p.tags && p.tags.length > 0 ? `
                <div class="tags">
                  ${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}
                </div>
              ` : ''}
            </div>
          </div>
        `).join('')}
      </div>
    </section>
  `).join('');

  // Footer
  document.getElementById('footer').innerHTML = `
    <h3>${r.nombre}</h3>
    <p>
      ${r.direccion}<br>
      Reservas: ${r.telefono}<br>
      ${r.email}
    </p>
  `;
}
</script>

</body>
</html>
